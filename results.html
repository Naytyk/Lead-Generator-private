<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lead dispatch — SHARE</title>
  <link rel="icon" href="assets/icon48.png">
  <style>
    :root {
      --bg: #08090c; --surface: #111318; --surface-2: #171a21; --border: #24272f;
      --text: #f4f5f7; --text-dim: #9aa0ad; --text-faint: #6b7280;
      --green: #00bf6f; --green-bright: #00d97e; --green-soft: rgba(0, 191, 111, .13);
      --danger: #f0553d;
    }
    * { box-sizing: border-box; }

    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 28px; background: #000; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    header img { height: 22px; }
    header .title { font-size: 13px; font-weight: 700; color: var(--text-dim); letter-spacing: .01em; }
    header .spacer { flex: 1; }
    .pill {
      font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .pill b { color: var(--green); }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 28px 56px; }

    .bar {
      display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; margin-bottom: 18px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label {
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-faint);
    }
    input {
      padding: 9px 11px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: inherit; font-size: 14px;
      font-weight: 700; letter-spacing: .1em; text-transform: uppercase; width: 130px;
    }
    input[readonly] { color: var(--green); }

    button {
      margin-left: auto; padding: 11px 22px; border: none; border-radius: 8px;
      background: var(--green); color: #04150d;
      font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: background .14s ease, opacity .14s ease;
    }
    button:hover:not(:disabled) { background: var(--green-bright); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    #status {
      margin-bottom: 18px; padding: 12px 16px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--text-dim); min-height: 44px;
      display: flex; align-items: center;
    }

    .table-scroll {
      overflow-x: auto; border: 1px solid var(--border);
      border-radius: 12px; background: var(--surface);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th {
      text-align: left; padding: 12px 16px; background: var(--surface-2);
      font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      color: var(--text-faint); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text-dim); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,.02); color: var(--text); }
    td:first-child { color: var(--text); font-weight: 600; }
    td:last-child { color: var(--green); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .empty td { text-align: center; padding: 40px; color: var(--text-faint); font-style: italic; }
  </style>
</head>

<body>
  <header>
    <img src="assets/share-wordmark.png" alt="SHARE">
    <span class="title">Lead Dispatch</span>
    <span class="spacer"></span>
    <span class="pill" id="countPill"><b id="leadCount">0</b> leads ready</span>
  </header>

  <div class="wrap">
    <div class="bar">
      <div class="field">
        <label for="userId">Your User ID</label>
        <input type="text" id="userId" maxlength="6" readonly placeholder="log in">
      </div>
      <button id="sendToSheetBtn">Push to my sheet</button>
    </div>

    <div id="status"></div>

    <div class="table-scroll">
      <table id="resultsTable">
        <thead>
          <tr><th>POC</th><th>Firm</th><th>Designation</th><th>Recipient</th></tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty"><td colspan="4">No leads loaded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="results.js"></script>
</body>
</html>
