<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leads sent — SHARE</title>
  <link rel="icon" href="assets/icon48.png">
  <style>
    :root {
      --bg: #08090c; --surface: #111318; --border: #24272f;
      --text: #f4f5f7; --text-dim: #9aa0ad; --text-faint: #6b7280;
      --green: #00bf6f; --green-soft: rgba(0, 191, 111, .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 40px 44px 34px; text-align: center; max-width: 440px; width: 100%;
    }
    .logo { height: 44px; margin-bottom: 30px; opacity: .95; }
    .check {
      width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 50%;
      background: var(--green-soft); border: 1px solid rgba(0,191,111,.4);
      color: var(--green); font-size: 30px; line-height: 62px; font-weight: 700;
    }
    h1 { margin: 0 0 10px; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
    #summary { margin: 0 0 24px; font-size: 14px; color: var(--text-dim); }
    #summary b { color: var(--green); font-variant-numeric: tabular-nums; }
    .sub { font-size: 12px; color: var(--text-faint); margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/share-logo.png" alt="SHARE — IIT Kharagpur">
    <div class="check">&#10003;</div>
    <h1>Leads sent</h1>
    <p id="summary">Your leads were dispatched to your sheet.</p>
    <p class="sub">You can close this tab.</p>
  </div>
  <script src="success.js"></script>
</body>
</html>
